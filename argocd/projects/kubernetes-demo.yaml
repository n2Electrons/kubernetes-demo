# Argo CD Project Configuration
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kubernetes-demo
  namespace: argocd
  labels:
    project: kubernetes-demo
spec:
  description: Kubernetes Demo Applications Project
  
  # Source repositories
  sourceRepos:
  - https://github.com/n2Electrons/kubernetes-demo.git
  - 'https://github.com/n2Electrons/*'
  
  # Destination clusters and namespaces
  destinations:
  - namespace: 'kub-app'
    server: https://kubernetes.default.svc
  - namespace: 'default'
    server: https://kubernetes.default.svc
  - namespace: 'monitoring'
    server: https://kubernetes.default.svc
  
  # Cluster resource allow list
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: ''
    kind: PersistentVolume
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRole
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRoleBinding
  - group: 'apiextensions.k8s.io'
    kind: CustomResourceDefinition
  
  # Namespace resource allow list
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: 'apps'
    kind: Deployment
  - group: 'apps'
    kind: ReplicaSet
  - group: 'apps'
    kind: StatefulSet
  - group: 'apps'
    kind: DaemonSet
  - group: 'networking.k8s.io'
    kind: Ingress
  - group: 'networking.k8s.io'
    kind: NetworkPolicy
  - group: 'autoscaling'
    kind: HorizontalPodAutoscaler
  - group: 'policy'
    kind: PodDisruptionBudget
  - group: 'rbac.authorization.k8s.io'
    kind: Role
  - group: 'rbac.authorization.k8s.io'
    kind: RoleBinding
  
  # Roles for this project
  roles:
  - name: admin
    description: Admin access to kubernetes-demo project
    policies:
    - p, proj:kubernetes-demo:admin, applications, *, kubernetes-demo/*, allow
    - p, proj:kubernetes-demo:admin, repositories, *, *, allow
    - p, proj:kubernetes-demo:admin, clusters, *, *, allow
    groups:
    - kubernetes-demo:admin
  
  - name: developer
    description: Developer access to kubernetes-demo project
    policies:
    - p, proj:kubernetes-demo:developer, applications, get, kubernetes-demo/*, allow
    - p, proj:kubernetes-demo:developer, applications, sync, kubernetes-demo/*, allow
    - p, proj:kubernetes-demo:developer, applications, action/*, kubernetes-demo/*, allow
    - p, proj:kubernetes-demo:developer, repositories, get, *, allow
    groups:
    - kubernetes-demo:developer