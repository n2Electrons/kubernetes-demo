# Argo CD Application for kub-app
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kub-app
  namespace: argocd
  labels:
    app: kub-app
spec:
  project: kubernetes-demo
  source:
    repoURL: https://github.com/n2Electrons/kubernetes-demo.git
    targetRevision: HEAD
    path: apps/kub-app
  destination:
    server: https://kubernetes.default.svc
    namespace: kub-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10