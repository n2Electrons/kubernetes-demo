# Argo CD Repository Configuration
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-demo-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/n2Electrons/kubernetes-demo.git
  name: kubernetes-demo
---
