apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kub-app-hpa
  namespace: kub-app
  labels:
    app: kub-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kub-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80