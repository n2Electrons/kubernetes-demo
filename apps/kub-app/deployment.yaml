apiVersion: apps/v1
kind: Deployment
metadata:
  name: kub-app
  namespace: kub-app
  labels:
    app: kub-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kub-app
  template:
    metadata:
      labels:
        app: kub-app
    spec:
      containers:
      - name: kub-app
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "100m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5