apiVersion: apps/v1
kind: Deployment
metadata:
  name: kub-app
  namespace: kub-app
  labels:
    app: kub-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kub-app
  template:
    metadata:
      labels:
        app: kub-app
    spec:
      containers:
      - name: kub-app
        image: nginx:alpine
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "32Mi"
            cpu: "100m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config